name: Rust CI

on:
  push:
    branches:
      - master
      - main
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & test Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies (GPUI on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libwayland-dev \
            wayland-protocols \
            libfontconfig1-dev \
            libfreetype-dev \
            libvulkan-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxext-dev \
            libxfixes-dev \
            libxcb1-dev

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Run tests
        run: cargo test --workspace

      - name: Upload recaf-rust binary
        uses: actions/upload-artifact@v4
        with:
          name: recaf-rust-${{ runner.os }}
          retention-days: 30
          if-no-files-found: error
          path: rust/target/debug/recaf-rust
